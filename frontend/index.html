<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenKrt - Smart Farming Platform</title>
    <meta name="description" content="GreenKrt - Empowering Indian farmers with drone services, AI soil analysis, and genuine agricultural products." />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lora:ital,wght@1,600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0d631b",
              "on-primary": "#ffffff",
              "primary-container": "#2e7d32",
              "on-primary-container": "#cbffc2",
              "primary-fixed": "#a3f69c",
              "primary-fixed-dim": "#88d982",
              "on-primary-fixed": "#002204",
              "on-primary-fixed-variant": "#005312",
              "secondary": "#126d27",
              "on-secondary": "#ffffff",
              "secondary-container": "#9cf49c",
              "on-secondary-container": "#19722b",
              "secondary-fixed": "#9ff79f",
              "secondary-fixed-dim": "#83da85",
              "on-secondary-fixed": "#002105",
              "on-secondary-fixed-variant": "#005318",
              "tertiary": "#774c00",
              "on-tertiary": "#ffffff",
              "tertiary-container": "#986200",
              "on-tertiary-container": "#ffeede",
              "tertiary-fixed": "#ffddb5",
              "tertiary-fixed-dim": "#ffb957",
              "on-tertiary-fixed": "#2a1800",
              "on-tertiary-fixed-variant": "#643f00",
              "error": "#ba1a1a",
              "on-error": "#ffffff",
              "error-container": "#ffdad6",
              "on-error-container": "#93000a",
              "surface": "#f9f9f9",
              "surface-dim": "#dadada",
              "surface-bright": "#f9f9f9",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f3f3f3",
              "surface-container": "#eeeeee",
              "surface-container-high": "#e8e8e8",
              "surface-container-highest": "#e2e2e2",
              "on-surface": "#1a1c1c",
              "on-surface-variant": "#40493d",
              "outline": "#707a6c",
              "outline-variant": "#bfcaba",
              "surface-tint": "#1b6d24",
              "inverse-surface": "#2f3131",
              "inverse-on-surface": "#f1f1f1",
              "inverse-primary": "#88d982",
              "surface-variant": "#e2e2e2",
              "background": "#f9f9f9",
              "on-background": "#1a1c1c",
              "brand-dark": "#0A1F0C",
              "brand-cta": "#00C853",
              "brand-mint": "#EAF2E8",
              "brand-medium": "#1B6B2F",
            },
            fontFamily: {
              "sans": ["Inter", "sans-serif"],
              "accent": ["Lora", "serif"],
            },
            spacing: {
              "sm": "12px",
              "margin-desktop": "64px",
              "margin-mobile": "16px",
              "md": "16px",
              "gutter": "16px",
              "lg": "24px",
              "tap-target-min": "48px",
              "xl": "32px",
              "base": "4px",
              "xs": "8px",
            },
            animation: {
              'marquee': 'marquee 40s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .icon-fill {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .glass-panel {
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
